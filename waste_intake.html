<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごみ持込量記録システム</title>
<style>
  :root{
    --ink:#e2604a;
    --ink-dark:#b8412c;
    --paper:#fffdf9;
    --line:#e4ded2;
    --text:#2b2622;
    --muted:#8a7f6e;
    --panel:#ffffff;
    --accent-bg:#fbf3ea;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3efe6;
    color:var(--text);
  }
  .app{max-width:1200px;margin:0 auto;padding:28px 20px 80px;}
  .app-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .app-header h1{font-size:22px;margin:0;letter-spacing:.04em;}
  .app-header h1 span{color:var(--ink);}
  .app-header p{margin:4px 0 0;color:var(--muted);font-size:12.5px;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{
    padding:9px 18px;border:1px solid var(--line);background:var(--panel);
    border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;}
  .form-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink);}

  .field-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 22px;align-items:start;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .field input, .field select{
    border:1px solid #d8d1c2;border-radius:7px;padding:9px 10px;font-size:14px;
    font-family:inherit;background:#fffefb;color:#000;font-weight:600;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(165,42,32,.1);
  }
  .locked-field{background:#f0ece0 !important;color:#000 !important;cursor:not-allowed;}
  .calc-field{background:#fbf3ea !important;color:var(--ink-dark) !important;font-weight:700 !important;}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .btn{
    padding:10px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    font-size:14px;font-weight:600;cursor:pointer;color:var(--text);
  }
  .btn:hover{background:#f1ece1;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--ink-dark);border-color:var(--ink-dark);}
  .btn-danger{color:#c94f3c;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap;}
  th{background:var(--accent-bg);color:var(--ink-dark);font-weight:700;position:sticky;top:0;}
  tbody tr:hover{background:#fbf7ee;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  .num{text-align:right;}
  .del-btn{background:none;border:none;color:#c94f3c;cursor:pointer;font-size:13px;text-decoration:underline;}

  .list-toolbar{margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .list-summary{color:var(--muted);font-size:13px;margin-left:auto;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .card-form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;margin-bottom:22px;}

  @media (max-width:720px){
    .field-grid{grid-template-columns:1fr 1fr;}
    .card-form{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1><span>ごみ持込</span>量記録システム</h1>
    <p>天理市 環境事業センター　計量票入力</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="input" onclick="switchTab('input')">入力</div>
    <div class="tab" data-tab="list" onclick="switchTab('list')">一覧</div>
    <div class="tab" data-tab="cards" onclick="switchTab('cards')">カード管理</div>
  </div>

  <!-- 入力タブ -->
  <div class="panel" id="tab-input">
    <div class="form-title">計量票 入力</div>
    <div class="field-grid">
      <div class="field">
        <label>日付 *</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>時刻</label>
        <input type="time" id="f-time">
      </div>
      <div class="field">
        <label>受付No. *</label>
        <input type="text" id="f-receipt" inputmode="numeric" placeholder="例: 148">
      </div>

      <div class="field">
        <label>カードNo. *</label>
        <input type="text" id="f-card" placeholder="例: 84">
      </div>
      <div class="field">
        <label>車番（カードNo.から自動）</label>
        <input type="text" id="f-vehicle" class="locked-field" readonly>
        <div class="field-hint" id="card-hint"></div>
      </div>
      <div class="field">
        <label>品種</label>
        <select id="f-item">
          <option value="可燃" selected>可燃</option>
          <option value="不燃">不燃</option>
        </select>
      </div>

      <div class="field">
        <label>車両区分</label>
        <input type="text" class="locked-field" value="指示書業者（事業系）" readonly>
      </div>
      <div class="field">
        <label>業者</label>
        <input type="text" class="locked-field" value="◎天理教営繕課" readonly>
      </div>
      <div class="field">
        <label>地区</label>
        <input type="text" class="locked-field" value="天理市" readonly>
      </div>

      <div class="field">
        <label>総重量(kg) *</label>
        <input type="number" id="f-total" step="10" inputmode="decimal">
      </div>
      <div class="field">
        <label>空車重量(kg) *</label>
        <input type="number" id="f-empty" step="10" inputmode="decimal">
      </div>
      <div class="field">
        <label>正味重量(kg)</label>
        <input type="text" id="f-net" class="calc-field" readonly value="0">
      </div>

      <div class="field">
        <label>手数料(円)（16円/kg）</label>
        <input type="text" id="f-fee" class="calc-field" readonly value="0">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="submit-btn" onclick="submitRecord()">登録する</button>
      <button class="btn" onclick="clearForm()">クリア</button>
    </div>
  </div>

  <!-- 一覧タブ -->
  <div class="panel" id="tab-list" style="display:none;">
    <div class="list-toolbar">
      <div class="form-title" style="margin:0;">一覧（日付の新しい順）</div>
      <div class="list-summary" id="list-summary"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日付</th><th>時刻</th><th>受付No.</th><th>カードNo.</th><th>車番</th>
            <th>品種</th><th class="num">総重量</th><th class="num">空車重量</th>
            <th class="num">正味重量</th><th class="num">手数料</th><th></th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="11">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- カード管理タブ -->
  <div class="panel" id="tab-cards" style="display:none;">
    <div class="form-title">カード車番対応表</div>
    <div class="card-form">
      <div class="field">
        <label>カードNo. *</label>
        <input type="text" id="c-card" placeholder="例: 38">
      </div>
      <div class="field">
        <label>車番 *</label>
        <input type="text" id="c-vehicle" placeholder="例: 奈良45つ4226">
      </div>
      <button class="btn btn-primary" onclick="submitCard()">登録・更新</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>カードNo.</th><th>車番</th><th>更新日時</th><th></th></tr></thead>
        <tbody id="card-body">
          <tr><td colspan="4">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zhxuntrhxnrssqpvcmvl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeHVudHJoeG5yc3NxcHZjbXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDcyNjYsImV4cCI6MjA5NzgyMzI2Nn0.l3pwvKZVVJqDA4HORqt-Op-cTvVF3bkX1ovWgAuSO58";

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(`Supabase error ${res.status}: ${t}`);
  }
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }
  catch(e){ console.warn('JSON解析失敗:', text); return null; }
}

function showToast(msg, duration=2600){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), duration);
}

function switchTab(name){
  ['input','list','cards'].forEach(n=>{
    document.getElementById('tab-'+n).style.display = (n===name) ? '' : 'none';
    document.querySelector(`.tab[data-tab="${n}"]`).classList.toggle('active', n===name);
  });
  if(name==='list') loadList();
  if(name==='cards') loadCards();
}

/* ---------- カード⇔車番 対応表（メモリキャッシュ） ---------- */
let CARD_MAP = {}; // { "84": "奈良400た9419", ... }

async function loadCardMap(){
  try{
    const rows = await sb('card_vehicle_map?select=card_no,vehicle_no');
    CARD_MAP = {};
    (rows||[]).forEach(r => CARD_MAP[String(r.card_no).trim()] = r.vehicle_no);
  }catch(e){
    console.error(e);
  }
}

document.getElementById('f-card').addEventListener('input', (e)=>{
  const card = e.target.value.trim();
  const hint = document.getElementById('card-hint');
  const vEl = document.getElementById('f-vehicle');
  if(!card){ vEl.value=''; hint.textContent=''; return; }
  if(CARD_MAP[card]){
    vEl.value = CARD_MAP[card];
    hint.textContent = '';
    hint.style.color = 'var(--muted)';
  }else{
    vEl.value = '';
    hint.textContent = '※このカードNo.は未登録です。「カード管理」タブで登録してください（未登録のまま登録も可能）';
    hint.style.color = '#c94f3c';
  }
});

/* ---------- 正味重量・手数料のリアルタイム計算（表示用） ---------- */
function recalcPreview(){
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const empty = parseFloat(document.getElementById('f-empty').value) || 0;
  const net = Math.max(total - empty, 0);
  const fee = net * 16;
  document.getElementById('f-net').value = net.toLocaleString();
  document.getElementById('f-fee').value = fee.toLocaleString();
}
document.getElementById('f-total').addEventListener('input', recalcPreview);
document.getElementById('f-empty').addEventListener('input', recalcPreview);

/* ---------- 登録 ---------- */
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function clearForm(){
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-time').value = '';
  document.getElementById('f-receipt').value = '';
  document.getElementById('f-card').value = '';
  document.getElementById('f-vehicle').value = '';
  document.getElementById('f-item').value = '可燃';
  document.getElementById('f-total').value = '';
  document.getElementById('f-empty').value = '';
  document.getElementById('card-hint').textContent = '';
  recalcPreview();
  document.getElementById('f-date').focus();
}

async function submitRecord(){
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const receipt = document.getElementById('f-receipt').value.trim();
  const card = document.getElementById('f-card').value.trim();
  const vehicle = document.getElementById('f-vehicle').value.trim();
  const item = document.getElementById('f-item').value;
  const total = parseFloat(document.getElementById('f-total').value);
  const empty = parseFloat(document.getElementById('f-empty').value);

  if(!date || !receipt || !card || isNaN(total) || isNaN(empty)){
    showToast('日付・受付No.・カードNo.・総重量・空車重量は必須です');
    return;
  }
  if(!vehicle){
    if(!confirm('カードNo.に対応する車番が見つかりません。このまま登録しますか？')) return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try{
    await sb('waste_records', {
      method:'POST',
      headers:{ 'Prefer':'return=minimal' },
      body: JSON.stringify({
        record_date: date,
        record_time: time || null,
        receipt_no: receipt,
        card_no: card,
        vehicle_no: vehicle || null,
        item_type: item,
        total_weight: total,
        empty_weight: empty
      })
    });
    showToast(`登録しました（正味重量: ${(total-empty).toLocaleString()} kg）`);
    clearForm();
  }catch(e){
    showToast('登録に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

/* ---------- 一覧 ---------- */
async function loadList(){
  const body = document.getElementById('list-body');
  body.innerHTML = '<tr><td colspan="11">読み込み中…</td></tr>';
  try{
    const rows = await sb('waste_records?select=*&order=record_date.desc,record_time.desc,id.desc&limit=500');
    if(!rows || rows.length===0){
      body.innerHTML = '<tr><td colspan="11">記録がありません</td></tr>';
      document.getElementById('list-summary').textContent = '';
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${r.record_date ?? ''}</td>
        <td>${r.record_time ?? ''}</td>
        <td>${r.receipt_no ?? ''}</td>
        <td>${r.card_no ?? ''}</td>
        <td>${r.vehicle_no ?? ''}</td>
        <td>${r.item_type ?? ''}</td>
        <td class="num">${Number(r.total_weight).toLocaleString()}</td>
        <td class="num">${Number(r.empty_weight).toLocaleString()}</td>
        <td class="num">${Number(r.net_weight).toLocaleString()}</td>
        <td class="num">${Number(r.fee).toLocaleString()}</td>
        <td><button class="del-btn" onclick="deleteRecord(${r.id})">削除</button></td>
      </tr>
    `).join('');

    const totalNet = rows.reduce((s,r)=> s + Number(r.net_weight||0), 0);
    const totalFee = rows.reduce((s,r)=> s + Number(r.fee||0), 0);
    document.getElementById('list-summary').textContent =
      `${rows.length}件 ／ 正味重量合計 ${totalNet.toLocaleString()} kg ／ 手数料合計 ${totalFee.toLocaleString()} 円`;
  }catch(e){
    body.innerHTML = `<tr><td colspan="11">読み込みに失敗しました: ${e.message}</td></tr>`;
    console.error(e);
  }
}

async function deleteRecord(id){
  if(!confirm('この記録を削除しますか？')) return;
  try{
    await sb(`waste_records?id=eq.${id}`, { method:'DELETE' });
    showToast('削除しました');
    loadList();
  }catch(e){
    showToast('削除に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

/* ---------- カード管理タブ ---------- */
async function loadCards(){
  const body = document.getElementById('card-body');
  body.innerHTML = '<tr><td colspan="4">読み込み中…</td></tr>';
  try{
    const rows = await sb('card_vehicle_map?select=*&order=card_no.asc');
    CARD_MAP = {};
    (rows||[]).forEach(r => CARD_MAP[String(r.card_no).trim()] = r.vehicle_no);
    if(!rows || rows.length===0){
      body.innerHTML = '<tr><td colspan="4">登録されているカードがありません</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${r.card_no}</td>
        <td>${r.vehicle_no}</td>
        <td>${r.updated_at ? new Date(r.updated_at).toLocaleString('ja-JP') : ''}</td>
        <td><button class="del-btn" onclick="deleteCard('${r.card_no.replace(/'/g,"\\'")}')">削除</button></td>
      </tr>
    `).join('');
  }catch(e){
    body.innerHTML = `<tr><td colspan="4">読み込みに失敗しました: ${e.message}</td></tr>`;
    console.error(e);
  }
}

async function submitCard(){
  const card = document.getElementById('c-card').value.trim();
  const vehicle = document.getElementById('c-vehicle').value.trim();
  if(!card || !vehicle){
    showToast('カードNo.と車番の両方を入力してください');
    return;
  }
  try{
    const existing = await sb(`card_vehicle_map?card_no=eq.${encodeURIComponent(card)}&select=card_no,vehicle_no`);
    if(existing && existing.length>0){
      if(!confirm(`カードNo.「${card}」は既に登録されています（現在の車番: ${existing[0].vehicle_no}）。\n車番を「${vehicle}」に更新しますか？`)) return;
      await sb(`card_vehicle_map?card_no=eq.${encodeURIComponent(card)}`, {
        method:'PATCH',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({ vehicle_no: vehicle, updated_at: new Date().toISOString() })
      });
      showToast('更新しました');
    }else{
      await sb('card_vehicle_map', {
        method:'POST',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({ card_no: card, vehicle_no: vehicle })
      });
      showToast('新しいカードを登録しました');
    }
    document.getElementById('c-card').value = '';
    document.getElementById('c-vehicle').value = '';
    loadCards();
  }catch(e){
    showToast('登録に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

async function deleteCard(cardNo){
  if(!confirm(`カードNo.「${cardNo}」の登録を削除しますか？`)) return;
  try{
    await sb(`card_vehicle_map?card_no=eq.${encodeURIComponent(cardNo)}`, { method:'DELETE' });
    showToast('削除しました');
    loadCards();
  }catch(e){
    showToast('削除に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

/* ---------- 起動時処理 ---------- */
(async function init(){
  document.getElementById('f-date').value = todayStr();
  await loadCardMap();
  recalcPreview();
})();
</script>
</body>
</html>
