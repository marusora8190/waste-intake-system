<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごみ持込量記録システム</title>
<style>
  :root{
    --ink:#e2604a;
    --ink-dark:#b8412c;
    --paper:#fffdf9;
    --line:#e4ded2;
    --text:#2b2622;
    --muted:#8a7f6e;
    --panel:#ffffff;
    --accent-bg:#fbf3ea;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3efe6;
    color:var(--text);
  }
  .app{max-width:1200px;margin:0 auto;padding:28px 20px 80px;}
  .app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .header-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .app-header h1{font-size:22px;margin:0;letter-spacing:.04em;display:flex;align-items:center;gap:12px;}
  .app-header h1 span{color:var(--ink);}
  .app-header p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;}
  .update-status{font-size:13px;font-weight:700;color:#2f9e44;opacity:0;transition:opacity .3s;white-space:nowrap;}
  .update-status.show{opacity:1;}

  .app-body{display:flex;flex-direction:column;gap:14px;align-items:stretch;}
  .sidebar{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;}
  .main-content{flex:1;min-width:0;}

  .refresh-btn{
    padding:9px 14px;border-radius:8px;border:none;background:var(--ink);
    color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .refresh-btn:hover{background:var(--ink-dark);}
  .refresh-btn:disabled{opacity:.6;cursor:not-allowed;}
  .refresh-icon{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:20px;height:20px;background:#3b82f6;border-radius:6px;color:#fff;
  }
  .refresh-icon svg{width:12px;height:12px;}

  .tab{
    padding:9px 12px;border:1px solid var(--line);background:var(--panel);
    border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted);text-align:center;
    white-space:nowrap;
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}


  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;}
  .form-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink);}
  .edit-banner{
    background:#fff3e0;border:1px solid #f0c78a;color:#9a5b12;
    padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;
  }
  .edit-banner a{color:#9a5b12;font-weight:700;text-decoration:underline;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px 18px;align-items:start;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .field input, .field select{
    border:1px solid #d8d1c2;border-radius:7px;padding:5px 8px;font-size:14px;
    font-family:inherit;background:#fffefb;color:#000;font-weight:600;line-height:1.4;
    text-align:center;text-align-last:center;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(165,42,32,.1);
  }
  .locked-field{background:#f0ece0 !important;color:#000 !important;cursor:not-allowed;}
  .calc-field{background:#fbf3ea !important;color:var(--ink-dark) !important;font-weight:700 !important;text-align:center;}
  .num-field{text-align:center;}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .inline-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .inline-field .form-title{margin-right:8px;}
  .inline-field label{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .inline-field select{
    border:1px solid #d8d1c2;border-radius:7px;padding:6px 10px;font-size:14px;
    font-family:inherit;background:#fffefb;color:#000;font-weight:600;width:auto;
  }

  .btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .btn{
    padding:10px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    font-size:14px;font-weight:600;cursor:pointer;color:var(--text);
  }
  .btn:hover{background:#f1ece1;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--ink-dark);border-color:var(--ink-dark);}
  .btn-danger{color:#c94f3c;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap;}
  th:last-child,td:last-child{border-right:none;}
  th{background:var(--accent-bg);color:var(--ink-dark);font-weight:700;position:sticky;top:0;z-index:1;}
  tbody tr:hover{background:#fbf7ee;}
  td.cell-nonburn{background:#fdead4;}
  tr:hover td.cell-nonburn{background:#fbdfc0;}
  .table-wrap{overflow-x:auto;overflow-y:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px;transition:max-height .2s;}
  .table-wrap.expanded{max-height:85vh;}
  .dept-inline-input{width:100%;min-width:60px;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:4px 6px;border-radius:6px;box-sizing:border-box;text-align:center;}
  .dept-inline-input:hover{border-color:var(--line);}
  .dept-inline-input:focus{border-color:var(--ink);background:#fff;outline:none;}
  #tab-list table th:nth-child(5), #tab-list table td:nth-child(5){width:150px;}
  #tab-list table th:nth-child(6), #tab-list table td:nth-child(6){width:1%;white-space:nowrap;}
  .num{text-align:center;}
  .fee-cell{text-align:right !important;padding-right:16px;}
  .compact-cols{table-layout:auto;width:auto;min-width:0;}
  .compact-cols th, .compact-cols td{padding:8px 6px;}
  .compact-cols th.num, .compact-cols td.num{white-space:nowrap;width:1%;}
  .compact-cols th.sticky-col, .compact-cols td.sticky-col{
    position:sticky;left:0;z-index:1;background:var(--panel);
    white-space:nowrap;
    box-shadow:2px 0 3px -2px rgba(0,0,0,.15);
    border-right:1px solid var(--line);
    width:1%;
  }
  .compact-cols thead th.sticky-col{z-index:2;background:var(--accent-bg);}
  .compact-cols tbody tr:hover td.sticky-col{background:#fbf7ee;}
  .department-table td.sticky-col{font-weight:700;color:var(--text);padding-left:10px;}
  .card-no-cell{font-weight:700;color:var(--text);}
  .card-dept-cell{text-align:left !important;padding-left:3em;}
  .action-cell{width:1%;white-space:nowrap;padding-left:10px;padding-right:10px;}
  .department-table th:nth-child(2), .department-table td:nth-child(2){
    text-align:center;padding-left:6px;padding-right:6px;white-space:nowrap;width:1%;
  }
  .sub-col{font-size:12px;color:var(--muted);font-weight:600;}
  .compact-cols th.veh-no, .compact-cols td.veh-no{
    padding-right:6px;padding-left:4px;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    width:1%;white-space:nowrap;
  }
  .compact-cols th.veh-no{text-align:center !important;}
  .compact-cols td.veh-no{text-align:left !important;font-weight:700;color:var(--text);padding-left:10px;}
  .compact-cols th.car-type-sticky, .compact-cols td.car-type-sticky{
    position:sticky;z-index:1;background:var(--panel);
    white-space:nowrap;text-align:center;
    box-shadow:2px 0 3px -2px rgba(0,0,0,.15);
    border-right:1px solid var(--line);
    width:1%;
  }
  .compact-cols td.car-type-sticky{text-align:left !important;font-weight:700;color:var(--text);}
  .compact-cols thead th.car-type-sticky{z-index:2;background:var(--accent-bg);}
  .compact-cols tbody tr:hover td.car-type-sticky{background:#fbf7ee;}

  .scroll-btn-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
  .scroll-btn{
    width:38px;height:34px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--text);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .scroll-btn:hover{background:#f1ece1;}
  .scroll-btn:active{background:#e8e1d2;}
  .fee-total-row td{
    background:var(--accent-bg) !important;font-weight:700;color:var(--ink-dark);
    border-top:2px solid var(--ink);
  }
  .compact-cols .fee-total-row td:first-child{background:var(--accent-bg) !important;}
  .del-btn{background:none;border:none;color:#c94f3c;cursor:pointer;font-size:13px;text-decoration:underline;}

  .list-toolbar{margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .list-summary{color:var(--ink-dark);font-size:15px;font-weight:700;margin-left:auto;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .card-form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;align-items:end;margin-bottom:22px;}

  @media (max-width:820px){
    .sidebar{flex-wrap:wrap;}
  }
  @media (max-width:720px){
    .field-grid{grid-template-columns:1fr 1fr;}
    .card-form{grid-template-columns:1fr;}
    .app-header{gap:6px;}
    .header-left{gap:10px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="header-left">
      <h1><span>天理市ごみ持込</span>量記録システム<span class="update-status" id="update-status"></span></h1>
      <div class="sidebar" id="header-tabs">
        <div class="tab active" data-tab="input" onclick="switchTab('input')">入　力</div>
        <div class="tab" data-tab="list" onclick="switchTab('list')">一　覧</div>
        <div class="tab" data-tab="cards" onclick="switchTab('cards')">カード管理</div>
        <div class="tab" data-tab="vehicle" onclick="switchTab('vehicle')">車番別集計</div>
        <div class="tab" data-tab="department" onclick="switchTab('department')">持込部署集計</div>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
        <span class="refresh-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
        <span id="refresh-btn-label">最新の状態に更新</span>
      </button>
    </div>
    
  </div>

  <div class="app-body">
  

  <div class="main-content">

  <!-- 入力タブ -->
  <div class="panel" id="tab-input">
    <div class="form-title">計量票 入力</div>
    <div class="edit-banner" id="edit-banner" style="display:none;">
      編集中の記録があります。<a href="#" onclick="cancelEdit();return false;">編集をキャンセルして新規入力に戻る</a>
    </div>
    <div class="field-grid">
      <div class="field">
        <label>日付 *</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>時刻</label>
        <input type="time" id="f-time">
      </div>
      <div class="field">
        <label>受付No. *</label>
        <input type="text" id="f-receipt" class="num-field" inputmode="numeric" placeholder="例: 148">
      </div>

      <div class="field">
        <label>カードNo. *</label>
        <input type="text" id="f-card" placeholder="例: 84">
      </div>
      <div class="field">
        <label>持込者部署</label>
        <input type="text" id="f-department" list="department-suggestions" placeholder="例: 営繕課" autocomplete="off">
        <datalist id="department-suggestions"></datalist>
        <datalist id="vehicle-suggestions"></datalist>
      </div>
      <div class="field">
        <label>車番（カードNo.から自動・手入力も可）</label>
        <input type="text" id="f-vehicle" list="vehicle-suggestions" autocomplete="off" placeholder="例: 奈良45つ4226">
        <div class="field-hint" id="card-hint"></div>
      </div>

      <div class="field">
        <label>品種</label>
        <select id="f-item">
          <option value="可燃" selected>可燃</option>
          <option value="不燃">不燃</option>
        </select>
      </div>
      <div class="field">
        <label>車両区分</label>
        <input type="text" class="locked-field" value="指示書業者（事業系）" readonly>
      </div>
      <div class="field">
        <label>業者</label>
        <input type="text" class="locked-field" value="◎天理教営繕課" readonly>
      </div>

      <div class="field">
        <label>地区</label>
        <input type="text" class="locked-field" value="天理市" readonly>
      </div>
      <div class="field">
        <label>総重量(kg) *</label>
        <input type="number" id="f-total" class="num-field" step="10" inputmode="decimal">
      </div>
      <div class="field">
        <label>空車重量(kg) *</label>
        <input type="number" id="f-empty" class="num-field" step="10" inputmode="decimal">
      </div>

      <div class="field">
        <label>正味重量(kg)</label>
        <input type="text" id="f-net" class="calc-field" readonly value="0">
      </div>
      <div class="field">
        <label>手数料(円)（16円/kg）</label>
        <input type="text" id="f-fee" class="calc-field" readonly value="0">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="submit-btn" onclick="submitRecord()">登録する</button>
      <button class="btn" onclick="clearForm()">クリア</button>
    </div>
  </div>

  <!-- 一覧タブ -->
  <div class="panel" id="tab-list" style="display:none;">
    <div class="list-toolbar">
      <div class="form-title" style="margin:0;">一覧</div>
      <select id="list-year" style="width:auto;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
        <option value="">すべての年</option>
      </select>
      <select id="list-month" style="width:auto;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
        <option value="">年間</option>
      </select>
      <input type="text" id="list-search-card" autocomplete="off" placeholder="カードNo.で検索" style="width:140px;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
      <input type="text" id="list-search-department" list="department-suggestions" autocomplete="off" placeholder="持込部署で検索" style="width:140px;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
      <input type="text" id="list-search-vehicle" list="vehicle-suggestions" autocomplete="off" placeholder="車　番で検索" style="width:140px;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
      <select id="list-search-item" style="width:auto;padding:6px 10px;border:1px solid #d8d1c2;border-radius:7px;font-size:13.5px;font-family:inherit;background:#fffefb;">
        <option value="">品種:すべて</option>
        <option value="可燃">可燃</option>
        <option value="不燃">不燃</option>
      </select>
      <button type="button" class="btn" onclick="clearListSearch()">検索解除</button>
      <div class="list-summary" id="list-summary"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="num">日付</th><th>時刻</th><th class="num">受付No.</th><th class="num">カードNo.</th><th class="num">持込部署</th><th class="num">車番</th>
            <th>品種</th><th class="num">総重量</th><th class="num">空車重量</th>
            <th class="num">正味重量</th><th class="num">手数料</th><th></th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="12">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- カード管理タブ -->
  <div class="panel" id="tab-cards" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;">
      <div class="form-title" style="margin:0;">カード車番対応表</div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn" id="card-form-toggle-btn" onclick="toggleCardFormSection()">入力欄を隠す</button>
        <button class="btn btn-primary" id="card-submit-btn" onclick="submitCard()">新規登録</button>
      </div>
    </div>
    <div id="card-form-section">
      <div class="edit-banner" id="card-edit-banner" style="display:none;">
        編集中のカードがあります。<a href="#" onclick="cancelCardEdit();return false;">編集をキャンセルして新規登録に戻る</a>
      </div>
      <div class="card-form">
        <div class="field">
          <label>カードNo. *</label>
          <input type="text" id="c-card" placeholder="例: 38">
        </div>
        <div class="field">
          <label>車両保管部署</label>
          <input type="text" id="c-department" placeholder="例: 営繕課">
        </div>
        <div class="field">
          <label>車　種</label>
          <input type="text" id="c-car-type" placeholder="例: 軽トラック">
        </div>
        <div class="field">
          <label>車番 *</label>
          <input type="text" id="c-vehicle" placeholder="例: 奈良45つ4226">
        </div>
      </div>
    </div>
    <div class="table-wrap" id="cards-table-wrap">
      <table>
        <thead><tr><th class="num">カードNo.</th><th class="num">車両保管部署</th><th class="num">車　種</th><th class="num">車番</th><th></th></tr></thead>
        <tbody id="card-body">
          <tr><td colspan="5">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 車番別集計タブ -->
  <div class="panel" id="tab-vehicle" style="display:none;">
    <div class="inline-field" style="margin-bottom:14px;">
      <div class="form-title" style="margin:0;">車番別集計（月別 運搬回数）</div>
      <label>年</label>
      <select id="v-year"></select>
      <div class="scroll-btn-row" style="margin-left:auto;margin-bottom:0;">
        <button class="scroll-btn" onclick="scrollVehicleTable(-240)" aria-label="左にスクロール">◀</button>
        <button class="scroll-btn" onclick="scrollVehicleTable(240)" aria-label="右にスクロール">▶</button>
      </div>
    </div>
    <div class="table-wrap" id="vehicle-table-wrap">
      <table class="compact-cols">
        <thead id="vehicle-thead"></thead>
        <tbody id="vehicle-body">
          <tr><td>読み込み中…</td></tr>
        </tbody>
        <tfoot><tr id="vehicle-fee-row"></tr></tfoot>
      </table>
    </div>
  </div>

  <!-- 持込部署集計タブ -->
  <div class="panel" id="tab-department" style="display:none;">
    <div class="inline-field" style="margin-bottom:14px;">
      <div class="form-title" style="margin:0;">持込部署集計（月別 運搬回数）</div>
      <label>年</label>
      <select id="d-year"></select>
      <div class="scroll-btn-row" style="margin-left:auto;margin-bottom:0;">
        <button class="scroll-btn" onclick="scrollDepartmentTable(-240)" aria-label="左にスクロール">◀</button>
        <button class="scroll-btn" onclick="scrollDepartmentTable(240)" aria-label="右にスクロール">▶</button>
      </div>
    </div>
    <div class="table-wrap" id="department-table-wrap">
      <table class="compact-cols department-table">
        <thead id="department-thead"></thead>
        <tbody id="department-body">
          <tr><td>読み込み中…</td></tr>
        </tbody>
        <tfoot><tr id="department-fee-row"></tr></tfoot>
      </table>
    </div>
  </div>

  </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zhxuntrhxnrssqpvcmvl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeHVudHJoeG5yc3NxcHZjbXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDcyNjYsImV4cCI6MjA5NzgyMzI2Nn0.l3pwvKZVVJqDA4HORqt-Op-cTvVF3bkX1ovWgAuSO58";

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(`Supabase error ${res.status}: ${t}`);
  }
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }
  catch(e){ console.warn('JSON解析失敗:', text); return null; }
}

function showToast(msg, duration=2600){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), duration);
}

function switchTab(name){
  ['input','list','cards','vehicle','department'].forEach(n=>{
    document.getElementById('tab-'+n).style.display = (n===name) ? '' : 'none';
    document.querySelector(`.tab[data-tab="${n}"]`).classList.toggle('active', n===name);
  });
  document.getElementById('refresh-btn').style.display = (name==='input') ? 'flex' : 'none';
  if(name==='list') loadList();
  if(name==='cards') loadCards();
  if(name==='vehicle') loadVehicleSummary();
  if(name==='department') loadDepartmentSummary();
}

/* ---------- カード⇔車番 対応表（メモリキャッシュ） ---------- */
let CARD_MAP = {}; // { "84": { vehicle: "奈良400た9419", department: "営繕課" }, ... }

async function loadCardMap(){
  try{
    const rows = await sb('card_vehicle_map?select=card_no,vehicle_no,department,car_type');
    CARD_MAP = {};
    (rows||[]).forEach(r => CARD_MAP[String(r.card_no).trim()] = { vehicle: r.vehicle_no, department: r.department || '', carType: r.car_type || '' });
  }catch(e){
    console.error(e);
  }
}

document.getElementById('f-card').addEventListener('input', (e)=>{
  const card = e.target.value.trim();
  const hint = document.getElementById('card-hint');
  const vEl = document.getElementById('f-vehicle');
  const dEl = document.getElementById('f-department');
  if(!card){ vEl.value=''; hint.textContent=''; return; }
  if(CARD_MAP[card]){
    vEl.value = CARD_MAP[card].vehicle || '';
    if(!dEl.value){ dEl.value = CARD_MAP[card].department || ''; }
    hint.textContent = '';
    hint.style.color = 'var(--muted)';
  }else{
    vEl.value = '';
    hint.textContent = '※このカードNo.は未登録です。「カード管理」タブで登録してください（未登録のまま登録も可能）';
    hint.style.color = '#c94f3c';
  }
});

document.getElementById('f-card').addEventListener('blur', (e)=>{
  const card = e.target.value.trim();
  if(card) fetchDepartmentSuggestions(card);
});

async function fetchDepartmentSuggestions(card){
  const dEl = document.getElementById('f-department');
  try{
    const rows = await sb(`waste_records?select=department&card_no=eq.${encodeURIComponent(card)}&department=not.is.null&order=id.desc&limit=20`);
    const seen = new Set();
    const values = [];
    (rows||[]).forEach(r=>{
      const v = (r.department || '').trim();
      if(v && !seen.has(v)){ seen.add(v); values.push(v); }
    });
    if(!dEl.value && values.length>0){
      dEl.value = values[0];
    }
  }catch(e){
    console.error(e);
  }
}

async function loadDepartmentOptions(){
  try{
    const wr = await sb('waste_records?select=department&department=not.is.null&limit=5000');
    const set = new Set();
    (wr||[]).forEach(r=>{ const v=(r.department||'').trim(); if(v) set.add(v); });
    const values = [...set].sort((a,b)=>a.localeCompare(b,'ja'));
    document.getElementById('department-suggestions').innerHTML = values.map(v=>`<option value="${v.replace(/"/g,'&quot;')}"></option>`).join('');
  }catch(e){
    console.error(e);
  }
}

async function loadVehicleOptions(){
  try{
    const [wr, cm] = await Promise.all([
      sb('waste_records?select=vehicle_no&vehicle_no=not.is.null&limit=5000'),
      sb('card_vehicle_map?select=vehicle_no&vehicle_no=not.is.null&limit=1000')
    ]);
    const set = new Set();
    (wr||[]).forEach(r=>{ const v=(r.vehicle_no||'').trim(); if(v) set.add(v); });
    (cm||[]).forEach(r=>{ const v=(r.vehicle_no||'').trim(); if(v) set.add(v); });
    const values = [...set].sort((a,b)=>a.localeCompare(b,'ja'));
    document.getElementById('vehicle-suggestions').innerHTML = values.map(v=>`<option value="${v.replace(/"/g,'&quot;')}"></option>`).join('');
  }catch(e){
    console.error(e);
  }
}

/* ---------- 正味重量・手数料のリアルタイム計算（表示用） ---------- */
function recalcPreview(){
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const empty = parseFloat(document.getElementById('f-empty').value) || 0;
  const net = Math.max(total - empty, 0);
  const fee = net * 16;
  document.getElementById('f-net').value = net.toLocaleString();
  document.getElementById('f-fee').value = fee.toLocaleString();
}
document.getElementById('f-total').addEventListener('input', recalcPreview);
document.getElementById('f-empty').addEventListener('input', recalcPreview);

/* ---------- Enterキーで次の入力項目へ移動（ロック項目は自動で飛ばす） ---------- */
const FORM_ORDER = ['f-date','f-time','f-receipt','f-card','f-department','f-vehicle','f-item','f-total','f-empty'];
FORM_ORDER.forEach((id, idx) => {
  const el = document.getElementById(id);
  el.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const nextId = FORM_ORDER[idx+1];
    if(nextId){
      const nextEl = document.getElementById(nextId);
      nextEl.focus();
      if(typeof nextEl.select === 'function' && nextEl.tagName !== 'SELECT'){
        nextEl.select();
      }
    }else{
      submitRecord();
    }
  });
});

/* ---------- 登録・編集 ---------- */
let EDITING_ID = null;

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function clearForm(){
  EDITING_ID = null;
  document.getElementById('edit-banner').style.display = 'none';
  document.getElementById('submit-btn').textContent = '登録する';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-time').value = '';
  document.getElementById('f-receipt').value = '';
  document.getElementById('f-card').value = '';
  document.getElementById('f-vehicle').value = '';
  document.getElementById('f-department').value = '';
  document.getElementById('f-item').value = '可燃';
  document.getElementById('f-total').value = '';
  document.getElementById('f-empty').value = '';
  document.getElementById('card-hint').textContent = '';
  recalcPreview();
  document.getElementById('f-date').focus();
}

function cancelEdit(){
  clearForm();
  showToast('編集をキャンセルしました');
}

function editRecord(id){
  const rec = LIST_RECORDS.find(r => r.id === id);
  if(!rec){
    showToast('記録が見つかりませんでした');
    return;
  }
  EDITING_ID = id;
  document.getElementById('f-date').value = rec.record_date || '';
  document.getElementById('f-time').value = rec.record_time || '';
  document.getElementById('f-receipt').value = rec.receipt_no || '';
  document.getElementById('f-card').value = rec.card_no || '';
  document.getElementById('f-item').value = rec.item_type || '可燃';
  document.getElementById('f-total').value = rec.total_weight ?? '';
  document.getElementById('f-empty').value = rec.empty_weight ?? '';

  const cardInfo = CARD_MAP[String(rec.card_no || '').trim()];
  document.getElementById('f-vehicle').value = rec.vehicle_no || (cardInfo ? cardInfo.vehicle : '') || '';
  document.getElementById('f-department').value = rec.department || (cardInfo ? cardInfo.department : '') || '';
  document.getElementById('card-hint').textContent = '';

  recalcPreview();
  document.getElementById('edit-banner').style.display = '';
  document.getElementById('submit-btn').textContent = '更新する';
  switchTab('input');
}

async function submitRecord(){
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const receipt = document.getElementById('f-receipt').value.trim();
  const card = document.getElementById('f-card').value.trim();
  const department = document.getElementById('f-department').value.trim();
  const vehicle = document.getElementById('f-vehicle').value.trim();
  const item = document.getElementById('f-item').value;
  const total = parseFloat(document.getElementById('f-total').value);
  const empty = parseFloat(document.getElementById('f-empty').value);

  if(!date || !receipt || !card || isNaN(total) || isNaN(empty)){
    showToast('日付・受付No.・カードNo.・総重量・空車重量は必須です');
    return;
  }
  if(!vehicle){
    if(!confirm('カードNo.に対応する車番が見つかりません。このまま登録しますか？')) return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try{
    const payload = {
      record_date: date,
      record_time: time || null,
      receipt_no: receipt,
      card_no: card,
      department: department || null,
      vehicle_no: vehicle || null,
      item_type: item,
      total_weight: total,
      empty_weight: empty
    };
    if(EDITING_ID){
      await sb(`waste_records?id=eq.${EDITING_ID}`, {
        method:'PATCH',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify(payload)
      });
      showToast(`更新しました（正味重量: ${(total-empty).toLocaleString()} kg）`);
      clearForm();
      switchTab('list');
    }else{
      await sb('waste_records', {
        method:'POST',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify(payload)
      });
      showToast(`登録しました（正味重量: ${(total-empty).toLocaleString()} kg）`);
      clearForm();
    }
  }catch(e){
    showToast((EDITING_ID ? '更新' : '登録') + 'に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

/* ---------- 一覧 ---------- */
let ALL_LIST_RECORDS = [];
let LIST_RECORDS = [];

function populateListYearFilter(){
  const sel = document.getElementById('list-year');
  if(sel.dataset.populated) return;
  const curYear = String(new Date().getFullYear());
  const years = [...new Set(ALL_LIST_RECORDS.map(r=> r.record_date.slice(0,4)))];
  if(!years.includes(curYear)) years.push(curYear);
  years.sort();
  sel.innerHTML = '<option value="">すべての年</option>' + years.map(y=>`<option value="${y}">${y}年</option>`).join('');
  const defaultYear = ALL_LIST_RECORDS.length ? ALL_LIST_RECORDS[0].record_date.slice(0,4) : curYear;
  sel.value = years.includes(defaultYear) ? defaultYear : '';
  sel.addEventListener('change', renderListFiltered);
  sel.dataset.populated = '1';
}

function populateListMonthFilter(){
  const sel = document.getElementById('list-month');
  if(sel.dataset.populated) return;
  const curMonth = String(new Date().getMonth() + 1);
  const months = Array.from({length:12}, (_, i) => i+1);
  sel.innerHTML = months.map(m=>`<option value="${m}">${m}月</option>`).join('') + '<option value="">年間</option>';
  const defaultMonth = ALL_LIST_RECORDS.length ? String(Number(ALL_LIST_RECORDS[0].record_date.slice(5,7))) : curMonth;
  sel.value = defaultMonth;
  sel.addEventListener('change', renderListFiltered);
  sel.dataset.populated = '1';
}

function clearListSearch(){
  document.getElementById('list-year').value = '';
  document.getElementById('list-month').value = '';
  document.getElementById('list-search-card').value = '';
  document.getElementById('list-search-department').value = '';
  document.getElementById('list-search-vehicle').value = '';
  document.getElementById('list-search-item').value = '';
  renderListFiltered();
}

function setupListSearchFilters(){
  const cardEl = document.getElementById('list-search-card');
  const deptEl = document.getElementById('list-search-department');
  const vehicleEl = document.getElementById('list-search-vehicle');
  const itemEl = document.getElementById('list-search-item');
  if(deptEl.dataset.bound) return;
  cardEl.addEventListener('input', renderListFiltered);
  deptEl.addEventListener('input', renderListFiltered);
  vehicleEl.addEventListener('input', renderListFiltered);
  itemEl.addEventListener('change', renderListFiltered);
  deptEl.dataset.bound = '1';
}

async function loadList(){
  const body = document.getElementById('list-body');
  body.innerHTML = '<tr><td colspan="12">読み込み中…</td></tr>';
  try{
    const rows = await sb('waste_records?select=*&order=record_date.desc,record_time.desc,id.desc&limit=5000');
    ALL_LIST_RECORDS = rows || [];
    populateListYearFilter();
    populateListMonthFilter();
    setupListSearchFilters();
    renderListFiltered();
  }catch(e){
    body.innerHTML = `<tr><td colspan="12">読み込みに失敗しました: ${e.message}</td></tr>`;
    console.error(e);
  }
}

async function updateVehicleInline(el){
  const id = Number(el.dataset.id);
  const value = el.value.trim();
  if(!value){
    showToast('車番は空にできません');
    const rec = ALL_LIST_RECORDS.find(r => r.id === id);
    el.value = rec ? (rec.vehicle_no || '') : '';
    return;
  }
  el.disabled = true;
  try{
    await sb(`waste_records?id=eq.${id}`, {
      method:'PATCH',
      headers:{ 'Prefer':'return=minimal' },
      body: JSON.stringify({ vehicle_no: value })
    });
    const recAll = ALL_LIST_RECORDS.find(r => r.id === id);
    if(recAll) recAll.vehicle_no = value;
    const recFiltered = LIST_RECORDS.find(r => r.id === id);
    if(recFiltered) recFiltered.vehicle_no = value;
    showToast('車番を更新しました');
  }catch(e){
    showToast('更新に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    el.disabled = false;
  }
}

async function updateDepartmentInline(el){
  const id = Number(el.dataset.id);
  const value = el.value.trim();
  el.disabled = true;
  try{
    await sb(`waste_records?id=eq.${id}`, {
      method:'PATCH',
      headers:{ 'Prefer':'return=minimal' },
      body: JSON.stringify({ department: value || null })
    });
    const recAll = ALL_LIST_RECORDS.find(r => r.id === id);
    if(recAll) recAll.department = value || null;
    const recFiltered = LIST_RECORDS.find(r => r.id === id);
    if(recFiltered) recFiltered.department = value || null;
    showToast('持込部署を更新しました');
  }catch(e){
    showToast('更新に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    el.disabled = false;
  }
}

function renderListFiltered(){
  const body = document.getElementById('list-body');
  const year = document.getElementById('list-year').value;
  const month = document.getElementById('list-month').value;
  const cardKeyword = document.getElementById('list-search-card').value.trim();
  const deptKeyword = document.getElementById('list-search-department').value.trim();
  const vehicleKeyword = document.getElementById('list-search-vehicle').value.trim();
  const itemFilter = document.getElementById('list-search-item').value;

  const rows = ALL_LIST_RECORDS.filter(r=>{
    if(year && r.record_date.slice(0,4) !== year) return false;
    if(month && r.record_date.slice(5,7) !== String(month).padStart(2,'0')) return false;
    if(cardKeyword && !String(r.card_no || '').includes(cardKeyword)) return false;
    if(deptKeyword && !(r.department || '').includes(deptKeyword)) return false;
    if(vehicleKeyword && !(r.vehicle_no || '').includes(vehicleKeyword)) return false;
    if(itemFilter && r.item_type !== itemFilter) return false;
    return true;
  });
  LIST_RECORDS = rows;

  if(rows.length===0){
    body.innerHTML = '<tr><td colspan="12">記録がありません</td></tr>';
    document.getElementById('list-summary').textContent = '';
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td class="num">${r.record_date ?? ''}</td>
      <td>${r.record_time ?? ''}</td>
      <td class="num">${r.receipt_no ?? ''}</td>
      <td class="num">${r.card_no ?? ''}</td>
      <td><input type="text" class="dept-inline-input" data-id="${r.id}" list="department-suggestions" autocomplete="off" value="${String(r.department ?? '').replace(/"/g,'&quot;')}" onchange="updateDepartmentInline(this)"></td>
      <td><input type="text" class="dept-inline-input" data-id="${r.id}" data-field="vehicle_no" list="vehicle-suggestions" autocomplete="off" value="${String(r.vehicle_no ?? '').replace(/"/g,'&quot;')}" onchange="updateVehicleInline(this)"></td>
      <td class="${r.item_type==='不燃' ? 'cell-nonburn' : ''}">${r.item_type ?? ''}</td>
      <td class="num">${Number(r.total_weight).toLocaleString()}</td>
      <td class="num">${Number(r.empty_weight).toLocaleString()}</td>
      <td class="num">${Number(r.net_weight).toLocaleString()}</td>
      <td class="num fee-cell">${Number(r.fee).toLocaleString()}</td>
      <td class="action-cell">
        <button class="del-btn" onclick="editRecord(${r.id})">編集</button>
        <button class="del-btn" onclick="deleteRecord(${r.id})">削除</button>
      </td>
    </tr>
  `).join('');

  const totalNet = rows.reduce((s,r)=> s + Number(r.net_weight||0), 0);
  const totalFee = rows.reduce((s,r)=> s + Number(r.fee||0), 0);
  document.getElementById('list-summary').textContent =
    `${rows.length}件 ／ 正味重量合計 ${totalNet.toLocaleString()} kg ／ 手数料合計 ${totalFee.toLocaleString()} 円`;
}

async function deleteRecord(id){
  if(!confirm('この記録を削除しますか？')) return;
  try{
    await sb(`waste_records?id=eq.${id}`, { method:'DELETE' });
    showToast('削除しました');
    loadList();
  }catch(e){
    showToast('削除に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

let EDITING_CARD_NO = null;

function editCard(cardNo){
  const info = CARD_MAP[String(cardNo).trim()];
  if(!info){
    showToast('カードのデータが見つかりませんでした');
    return;
  }
  EDITING_CARD_NO = cardNo;
  document.getElementById('c-card').value = cardNo;
  document.getElementById('c-department').value = info.department || '';
  document.getElementById('c-car-type').value = info.carType || '';
  document.getElementById('c-vehicle').value = info.vehicle || '';
  document.getElementById('card-submit-btn').textContent = '更新する';
  document.getElementById('card-edit-banner').style.display = '';
}

function toggleCardFormSection(){
  const sec = document.getElementById('card-form-section');
  const btn = document.getElementById('card-form-toggle-btn');
  const wrap = document.getElementById('cards-table-wrap');
  const isHidden = sec.style.display === 'none';
  if(isHidden){
    sec.style.display = '';
    btn.textContent = '入力欄を隠す';
    wrap.classList.remove('expanded');
  }else{
    sec.style.display = 'none';
    btn.textContent = '入力欄を表示';
    wrap.classList.add('expanded');
  }
}

function cancelCardEdit(){
  EDITING_CARD_NO = null;
  document.getElementById('c-card').value = '';
  document.getElementById('c-department').value = '';
  document.getElementById('c-car-type').value = '';
  document.getElementById('c-vehicle').value = '';
  document.getElementById('card-submit-btn').textContent = '新規登録';
  document.getElementById('card-edit-banner').style.display = 'none';
}

async function submitCard(){
  const card = document.getElementById('c-card').value.trim();
  const department = document.getElementById('c-department').value.trim();
  const carType = document.getElementById('c-car-type').value.trim();
  const vehicle = document.getElementById('c-vehicle').value.trim();
  if(!card || !vehicle){
    showToast('カードNo.と車番の両方を入力してください');
    return;
  }
  try{
    if(EDITING_CARD_NO){
      await sb(`card_vehicle_map?card_no=eq.${encodeURIComponent(EDITING_CARD_NO)}`, {
        method:'PATCH',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({ card_no: card, vehicle_no: vehicle, department: department || null, car_type: carType || null, updated_at: new Date().toISOString() })
      });
      showToast('更新しました');
    }else{
      await sb('card_vehicle_map', {
        method:'POST',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({ card_no: card, vehicle_no: vehicle, department: department || null, car_type: carType || null })
      });
      showToast('新しいカードを登録しました');
    }
    cancelCardEdit();
    loadCards();
  }catch(e){
    showToast((EDITING_CARD_NO ? '更新' : '登録') + 'に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

async function deleteCard(cardNo){
  if(!confirm(`カードNo.「${cardNo}」の登録を削除しますか？`)) return;
  try{
    await sb(`card_vehicle_map?card_no=eq.${encodeURIComponent(cardNo)}`, { method:'DELETE' });
    showToast('削除しました');
    if(EDITING_CARD_NO === cardNo) cancelCardEdit();
    loadCards();
  }catch(e){
    showToast('削除に失敗しました: ' + e.message, 6000);
    console.error(e);
  }
}

/* ---------- 集計共通：全記録を取得 ---------- */
let ALL_RECORDS = [];

function last4(vehicleNo){
  if(!vehicleNo) return '';
  const s = String(vehicleNo);
  const match = s.match(/(\d+)$/);
  return match ? match[1] : s.slice(-4);
}

async function loadAllRecords(){
  const rows = await sb('waste_records?select=vehicle_no,department,item_type,record_date,net_weight,fee&order=record_date.asc&limit=5000');
  ALL_RECORDS = rows || [];
}

/* ---------- 車番別集計タブ（月別 運搬回数） ---------- */
async function loadVehicleSummary(){
  const body = document.getElementById('vehicle-body');
  body.innerHTML = '<tr><td>読み込み中…</td></tr>';
  try{
    await loadAllRecords();
    populateVehicleYearFilter();
    renderVehicleSummary();
  }catch(e){
    body.innerHTML = `<tr><td>読み込みに失敗しました: ${e.message}</td></tr>`;
    console.error(e);
  }
}

function populateVehicleYearFilter(){
  const yearSel = document.getElementById('v-year');
  if(yearSel.dataset.populated) return;

  const now = new Date();
  const curYear = String(now.getFullYear());
  const years = [...new Set(ALL_RECORDS.map(r=>r.record_date.slice(0,4)))];
  if(!years.includes(curYear)) years.push(curYear);
  years.sort();

  yearSel.innerHTML = years.map(y=>`<option value="${y}">${y}年</option>`).join('');
  yearSel.value = curYear;
  yearSel.addEventListener('change', renderVehicleSummary);
  yearSel.dataset.populated = '1';
}

function scrollVehicleTable(delta){
  const el = document.getElementById('vehicle-table-wrap');
  if(el) el.scrollBy({left: delta, behavior:'smooth'});
}

function alignStickyHeaderRows(theadId){
  const thead = document.getElementById(theadId);
  if(!thead || thead.rows.length < 2) return;
  const row1 = thead.rows[0];
  const row2 = thead.rows[1];
  const row1Height = row1.getBoundingClientRect().height;
  Array.from(row2.cells).forEach(cell => { cell.style.top = row1Height + 'px'; });
}

function getCarTypeByVehicle(vehicleNo){
  for(const k in CARD_MAP){
    if(CARD_MAP[k].vehicle === vehicleNo) return CARD_MAP[k].carType || '';
  }
  return '';
}

function alignVehicleStickyColumns(){
  const wrap = document.getElementById('vehicle-table-wrap');
  if(!wrap) return;
  const vehTh = wrap.querySelector('th.sticky-col');
  if(!vehTh) return;
  const w = vehTh.getBoundingClientRect().width;
  wrap.querySelectorAll('.car-type-sticky').forEach(el => { el.style.left = w + 'px'; });
}
window.addEventListener('resize', () => {
  alignVehicleStickyColumns();
  alignStickyHeaderRows('vehicle-thead');
  alignStickyHeaderRows('department-thead');
});

function renderVehicleSummary(){
  const thead = document.getElementById('vehicle-thead');
  const body = document.getElementById('vehicle-body');
  const feeRow = document.getElementById('vehicle-fee-row');
  const year = document.getElementById('v-year').value;

  const yearRecords = ALL_RECORDS.filter(r=> r.record_date.slice(0,4) === year);
  const months = [...new Set(yearRecords.map(r=>r.record_date.slice(0,7)))].sort();
  const vehicles = [...new Set(ALL_RECORDS.map(r=>r.vehicle_no).filter(Boolean))].sort();

  const row1 = '<th class="veh-no sticky-col" rowspan="2">車番</th><th class="car-type-sticky" rowspan="2">車　種</th>' + months.map(m=>{
    const mo = Number(m.split('-')[1]);
    return `<th class="num" colspan="2">${mo}月</th>`;
  }).join('') + '<th class="num" rowspan="2">正味重量合計</th><th class="num" rowspan="2">手数料合計</th>';
  const row2 = months.map(()=> '<th class="num sub-col">kg</th><th class="num sub-col">回</th>').join('');
  thead.innerHTML = `<tr>${row1}</tr><tr>${row2}</tr>`;

  if(vehicles.length===0 || months.length===0){
    body.innerHTML = '<tr><td>データがありません</td></tr>';
    feeRow.innerHTML = '';
    return;
  }
  let grandCount = 0, grandNet = 0, grandFeeAll = 0;
  body.innerHTML = vehicles.map(v=>{
    let totalCount = 0;
    let totalNet = 0;
    let totalFee = 0;
    const cells = months.map(m=>{
      const matched = yearRecords.filter(r=> r.vehicle_no===v && r.record_date.slice(0,7)===m);
      const cnt = matched.length;
      const net = matched.reduce((s,r)=> s + Number(r.net_weight||0), 0);
      const fee = matched.reduce((s,r)=> s + Number(r.fee||0), 0);
      totalCount += cnt;
      totalNet += net;
      totalFee += fee;
      if(cnt===0) return `<td class="num sub-col">-</td><td class="num sub-col">-</td>`;
      return `<td class="num sub-col">${net.toLocaleString()}</td><td class="num sub-col">${cnt.toLocaleString()}</td>`;
    }).join('');
    grandCount += totalCount;
    grandNet += totalNet;
    grandFeeAll += totalFee;
    const netCell = totalCount===0 ? '-' : `${totalNet.toLocaleString()}kg`;
    const feeCell = totalCount===0 ? '-' : `${totalFee.toLocaleString()}円`;
    const carType = getCarTypeByVehicle(v);
    return `<tr><td class="veh-no sticky-col">${v}</td><td class="car-type-sticky">${carType}</td>${cells}<td class="num">${netCell}</td><td class="num">${feeCell}</td></tr>`;
  }).join('');

  const feeCells = months.map(m=>{
    const fee = yearRecords.filter(r=> r.record_date.slice(0,7)===m)
      .reduce((s,r)=> s + Number(r.fee||0), 0);
    return `<td class="num" colspan="2">${fee.toLocaleString()}円</td>`;
  }).join('');
  const grandNetCell = grandCount===0 ? '-' : `${grandNet.toLocaleString()}kg`;
  const grandFeeCell = grandCount===0 ? '-' : `${grandFeeAll.toLocaleString()}円`;
  feeRow.className = 'fee-total-row';
  feeRow.innerHTML = `<td class="sticky-col" colspan="2">手数料合計</td>${feeCells}<td class="num">${grandNetCell}</td><td class="num">${grandFeeCell}</td>`;

  alignVehicleStickyColumns();
  alignStickyHeaderRows('vehicle-thead');
}

function scrollDepartmentTable(delta){

function renderDepartmentSummary(){
  const thead = document.getElementById('department-thead');
  const body = document.getElementById('department-body');
  const feeRow = document.getElementById('department-fee-row');
  const year = document.getElementById('d-year').value;

  const yearRecords = ALL_RECORDS.filter(r=> r.record_date.slice(0,4) === year);
  const months = [...new Set(yearRecords.map(r=>r.record_date.slice(0,7)))].sort();

  const pairKey = r => `${r.department}|||${r.vehicle_no || ''}`;
  const pairs = [...new Set(
    ALL_RECORDS.filter(r=>r.department).map(pairKey)
  )].sort().map(k=>{
    const [department, vehicle_no] = k.split('|||');
    return { department, vehicle_no };
  });

  const row1 = '<th class="sticky-col" rowspan="2">持込部署</th><th class="veh-no" rowspan="2">車番</th>' + months.map(m=>{
    const mo = Number(m.split('-')[1]);
    return `<th class="num" colspan="2">${mo}月</th>`;
  }).join('') + '<th class="num" rowspan="2">正味重量合計</th><th class="num" rowspan="2">手数料合計</th>';
  const row2 = months.map(()=> '<th class="num sub-col">kg</th><th class="num sub-col">回</th>').join('');
  thead.innerHTML = `<tr>${row1}</tr><tr>${row2}</tr>`;

  if(pairs.length===0 || months.length===0){
    body.innerHTML = '<tr><td>データがありません</td></tr>';
    feeRow.innerHTML = '';
    return;
  }
  let grandCount = 0, grandNet = 0, grandFeeAll = 0;
  body.innerHTML = pairs.map(p=>{
    let totalCount = 0;
    let totalNet = 0;
    let totalFee = 0;
    const cells = months.map(m=>{
      const matched = yearRecords.filter(r=> r.department===p.department && (r.vehicle_no || '')===p.vehicle_no && r.record_date.slice(0,7)===m);
      const cnt = matched.length;
      const net = matched.reduce((s,r)=> s + Number(r.net_weight||0), 0);
      const fee = matched.reduce((s,r)=> s + Number(r.fee||0), 0);
      totalCount += cnt;
      totalNet += net;
      totalFee += fee;
      if(cnt===0) return `<td class="num sub-col">-</td><td class="num sub-col">-</td>`;
      return `<td class="num sub-col">${net.toLocaleString()}</td><td class="num sub-col">${cnt.toLocaleString()}</td>`;
    }).join('');
    grandCount += totalCount;
    grandNet += totalNet;
    grandFeeAll += totalFee;
    const netCell = totalCount===0 ? '-' : `${totalNet.toLocaleString()}kg`;
    const feeCell = totalCount===0 ? '-' : `${totalFee.toLocaleString()}円`;
    return `<tr><td class="sticky-col">${p.department}</td><td class="veh-no">${p.vehicle_no}</td>${cells}<td class="num">${netCell}</td><td class="num">${feeCell}</td></tr>`;
  }).join('');

  const yearRecordsWithDept = yearRecords.filter(r=> r.department);

  const feeCells = months.map(m=>{
    const fee = yearRecordsWithDept.filter(r=> r.record_date.slice(0,7)===m)
      .reduce((s,r)=> s + Number(r.fee||0), 0);
    return `<td class="num" colspan="2">${fee.toLocaleString()}円</td>`;
  }).join('');
  const grandNetCell = grandCount===0 ? '-' : `${grandNet.toLocaleString()}kg`;
  const grandFeeCell = grandCount===0 ? '-' : `${grandFeeAll.toLocaleString()}円`;
  feeRow.className = 'fee-total-row';
  feeRow.innerHTML = `<td colspan="2" class="sticky-col">手数料合計</td>${feeCells}<td class="num">${grandNetCell}</td><td class="num">${grandFeeCell}</td>`;
  alignStickyHeaderRows('department-thead');
}

/* ---------- 最新の状態に更新 ---------- */
async function refreshData(){
  const btn = document.getElementById('refresh-btn');
  const label = document.getElementById('refresh-btn-label');
  btn.disabled = true;
  const originalText = label.textContent;
  label.textContent = '更新中…';
  try{
    await loadCardMap();
    await loadDepartmentOptions();
    await loadVehicleOptions();
    await loadList();
    await loadCards();
    await loadVehicleSummary();
    await loadDepartmentSummary();
    const status = document.getElementById('update-status');
    status.textContent = '✓ 最新の状態に更新されました';
    status.classList.add('show');
    clearTimeout(status._timer);
    status._timer = setTimeout(()=>status.classList.remove('show'), 3000);
  }catch(e){
    showToast('更新に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    btn.disabled = false;
    label.textContent = originalText;
  }
}

/* ---------- 起動時処理 ---------- */
(async function init(){
  document.getElementById('f-date').value = todayStr();
  document.getElementById('refresh-btn').style.display = 'flex';
  await loadCardMap();
  await loadDepartmentOptions();
  await loadVehicleOptions();
  recalcPreview();
})();
</script>
